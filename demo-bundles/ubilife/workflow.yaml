schemaVersion: "1.0"
metadata:
  id: "ubilife"
  name: "UbiLife"
  description: >-
    The UbiLife analysis (github.com/dtu-digital-health/UbiLife), read from the
    CARP database: the prepared tables, the 14 exploration figures and the
    numbers it reports. One workflow for every year; the study id and the dates
    are its arguments. As written it reads UbiLife 2026.
  version: "1.0"
  tags:
    - "ubilife"
    - "ubicomp"
    - "carp"
    - "sql"
    - "surveys"
    - "steps"
environments:
  env-ubilife:
    name: "UbiLife analysis"
    kind: "pixi"
    spec:
      dependencies:
        - "pypi:pandas"
        - "pypi:numpy"
        - "pypi:matplotlib>=3.9"
        - "pypi:seaborn"
        - "pypi:ijson"
      pythonVersion:
        - "3.12"
steps:
  # The study and the arrival window. For 2025: studyId=b3607581-56c6-4652-a4f6-8e86e5a4e7e5,
  # --from 2025-10-01, --to 2026-01-16 (the published export's cut), and 13-17 Oct 2025
  # in the steps below. See README.md.
  - id: "query"
    uses: "core.io.query-sql"
    metadata:
      name: "Read the study from CARP"
      description: "Every stored sequence of the study, by arrival time"
      version: "1.0"
    dependsOn: []
    inputs:
      - id: "query"
        source:
          type: "file"
          path: "data/study-data.sql"
    args:
      - "--param"
      - "studyId=ba1834de-8caf-4e0e-9ec3-8db05285777f"
      - "--from"
      - "2026-10-01T00:00:00.000+00"
      - "--to"
      - "2026-11-01T00:00:00.000+00"
  - id: "decode"
    uses: "core.io.decode-carp-data-streams"
    metadata:
      name: "Decode the data streams"
      description: "Stored sequences to the measurement and provenance tables"
      version: "1.0"
    dependsOn:
      - "query"
    inputs:
      - id: "rows"
        source:
          type: "step-output"
          stepId: "query"
          outputId: "rows"
  - id: "split"
    metadata:
      name: "Split into streams"
      description: "One table per stream, with participant and timestamp"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "decode"
    task:
      type: "command"
      id: "task-split"
      name: "split"
      executable: "python"
      args:
        - "scripts/ubilife/split_streams.py"
        - "--measurements"
        - "input.0"
        - "--provenance"
        - "input.1"
        - "--stream"
        - "stepcount,stepevent"
        - "output.0"
        - "--stream"
        - "location"
        - "output.1"
        - "--stream"
        - "activity"
        - "output.2"
        - "--stream"
        - "survey"
        - "output.3"
        - "--stream"
        - "heartbeat"
        - "output.4"
        - "--stream"
        - "deviceinformation"
        - "output.5"
        - "--stream"
        - "weather"
        - "output.6"
    inputs:
      - id: "measurements"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Measurement table"
        source:
          type: "step-output"
          stepId: "decode"
          outputId: "measurements"
      - id: "provenance"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Provenance table"
        source:
          type: "step-output"
          stepId: "decode"
          outputId: "provenance"
    outputs:
      - id: "steps"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Step counter: stepcount (2025) or stepevent (2026)"
      - id: "location"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Location fixes"
      - id: "activity"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Activity recognition"
      - id: "survey"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Surveys, one row each, the task result as JSON"
      - id: "heartbeat"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Sampling heartbeat"
      - id: "deviceinformation"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Device reports"
      - id: "weather"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Weather readings"
  - id: "prepare-steps"
    metadata:
      name: "Prepare step counts"
      description: "Conference window, counter to per-interval steps"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "split"
    task:
      type: "command"
      id: "task-prepare-steps"
      name: "prepare-steps"
      executable: "python"
      args:
        - "scripts/ubilife/prepare_steps.py"
        - "--steps"
        - "input.0"
        - "--from"
        - "2026-10-11"
        - "--to"
        - "2026-10-16"
        - "--intervals"
        - "output.0"
        - "--daily"
        - "output.1"
    inputs:
      - id: "steps"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Step counter: stepcount (2025) or stepevent (2026)"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "steps"
    outputs:
      - id: "intervals"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Per-interval steps: steps_cumulative, steps_delta"
      - id: "daily-steps"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Steps per participant per day"
  - id: "prepare-surveys"
    metadata:
      name: "Parse surveys"
      description: "Submitted surveys to one table per instrument"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "split"
    task:
      type: "command"
      id: "task-prepare-surveys"
      name: "prepare-surveys"
      executable: "python"
      args:
        - "scripts/ubilife/prepare_surveys.py"
        - "--surveys"
        - "input.0"
        - "--onboarding"
        - "output.0"
        - "--stress"
        - "output.1"
        - "--sleep"
        - "output.2"
        - "--who5"
        - "output.3"
        - "--bfi10"
        - "output.4"
        - "--events"
        - "output.5"
    inputs:
      - id: "survey"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Surveys, one row each, the task result as JSON"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "survey"
    outputs:
      - id: "onboarding"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant: age, gender, role, prior UbiComp, presenter"
      - id: "stress"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per answer: stress 0-10"
      - id: "sleep"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per answer: sleep quality and hours"
      - id: "who5"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant: WHO-5 items and score"
      - id: "bfi10"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant: Big Five dimensions"
      - id: "events"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant per session or keynote rating"
  - id: "figures-overview"
    metadata:
      name: "Coverage figures"
      description: "What was collected, when, and from whom"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "decode"
      - "split"
    task:
      type: "command"
      id: "task-figures-overview"
      name: "figures-overview"
      executable: "python"
      args:
        - "scripts/ubilife/figures.py"
        - "--provenance"
        - "input.0"
        - "--steps"
        - "input.1"
        - "--location"
        - "input.2"
        - "--activity"
        - "input.3"
        - "--survey"
        - "input.4"
        - "--heartbeat"
        - "input.5"
        - "--window-from"
        - "2026-10-11"
        - "--window-to"
        - "2026-10-16"
        - "--coverage-from"
        - "2026-10-11 00:00:00"
        - "--coverage-to"
        - "2026-10-15 23:59:59"
        - "--figure"
        - "stream_overview"
        - "output.0"
        - "--figure"
        - "daily_volume"
        - "output.1"
        - "--figure"
        - "participant_spans"
        - "output.2"
        - "--figure"
        - "records_per_participant"
        - "output.3"
        - "--figure"
        - "heartbeat_coverage"
        - "output.4"
    inputs:
      - id: "provenance"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Provenance table"
        source:
          type: "step-output"
          stepId: "decode"
          outputId: "provenance"
      - id: "steps"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Step counter: stepcount (2025) or stepevent (2026)"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "steps"
      - id: "location"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Location fixes"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "location"
      - id: "activity"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Activity recognition"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "activity"
      - id: "survey"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Surveys, one row each, the task result as JSON"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "survey"
      - id: "heartbeat"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Sampling heartbeat"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "heartbeat"
    outputs:
      - id: "stream-overview"
        descriptor:
          fileFormat: "png"
          notes: "Records and participants per stream"
      - id: "daily-volume"
        descriptor:
          fileFormat: "png"
          notes: "Records per day, four key streams"
      - id: "participant-spans"
        descriptor:
          fileFormat: "png"
          notes: "Each participant's active period"
      - id: "records-per-participant"
        descriptor:
          fileFormat: "png"
          notes: "Records per participant, ranked"
      - id: "heartbeat-coverage"
        descriptor:
          fileFormat: "png"
          notes: "Heartbeat coverage, 4-hour bins, conference window"
  - id: "figures-sensors"
    metadata:
      name: "Sensor figures"
      description: "Steps, activity, devices and weather"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "split"
    task:
      type: "command"
      id: "task-figures-sensors"
      name: "figures-sensors"
      executable: "python"
      args:
        - "scripts/ubilife/figures.py"
        - "--steps"
        - "input.0"
        - "--activity"
        - "input.1"
        - "--deviceinformation"
        - "input.2"
        - "--weather"
        - "input.3"
        - "--window-from"
        - "2026-10-11"
        - "--window-to"
        - "2026-10-16"
        - "--coverage-from"
        - "2026-10-11 00:00:00"
        - "--coverage-to"
        - "2026-10-15 23:59:59"
        - "--figure"
        - "step_cumulative_vs_delta"
        - "output.0"
        - "--figure"
        - "activity_types"
        - "output.1"
        - "--figure"
        - "devices"
        - "output.2"
        - "--figure"
        - "weather"
        - "output.3"
    inputs:
      - id: "steps"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Step counter: stepcount (2025) or stepevent (2026)"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "steps"
      - id: "activity"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Activity recognition"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "activity"
      - id: "deviceinformation"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Device reports"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "deviceinformation"
      - id: "weather"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Weather readings"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "weather"
    outputs:
      - id: "step-cumulative-vs-delta"
        descriptor:
          fileFormat: "png"
          notes: "Cumulative counter against deltas, one participant"
      - id: "activity-types"
        descriptor:
          fileFormat: "png"
          notes: "Activity types, overall and by hour"
      - id: "devices"
        descriptor:
          fileFormat: "png"
          notes: "Platform, manufacturer, hardware"
      - id: "weather"
        descriptor:
          fileFormat: "png"
          notes: "Temperature, conditions, humidity, wind"
  - id: "figures-surveys"
    metadata:
      name: "Survey figures"
      description: "Surveys, demographics, wellbeing, ratings"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "split"
    task:
      type: "command"
      id: "task-figures-surveys"
      name: "figures-surveys"
      executable: "python"
      args:
        - "scripts/ubilife/figures.py"
        - "--survey"
        - "input.0"
        - "--window-from"
        - "2026-10-11"
        - "--window-to"
        - "2026-10-16"
        - "--coverage-from"
        - "2026-10-11 00:00:00"
        - "--coverage-to"
        - "2026-10-15 23:59:59"
        - "--figure"
        - "survey_overview"
        - "output.0"
        - "--figure"
        - "demographics"
        - "output.1"
        - "--figure"
        - "daily_surveys"
        - "output.2"
        - "--figure"
        - "who5_bfi10"
        - "output.3"
        - "--figure"
        - "session_ratings"
        - "output.4"
    inputs:
      - id: "survey"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Surveys, one row each, the task result as JSON"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "survey"
    outputs:
      - id: "survey-overview"
        descriptor:
          fileFormat: "png"
          notes: "Submissions against cancellations, and over time"
      - id: "demographics"
        descriptor:
          fileFormat: "png"
          notes: "Age, gender, role, prior UbiComp"
      - id: "daily-surveys"
        descriptor:
          fileFormat: "png"
          notes: "Stress, sleep quality, sleep duration"
      - id: "who5-bfi10"
        descriptor:
          fileFormat: "png"
          notes: "WHO-5 and BFI-10"
      - id: "session-ratings"
        descriptor:
          fileFormat: "png"
          notes: "Session and keynote ratings"
  - id: "findings"
    metadata:
      name: "Summarise the findings"
      description: "The numbers the UbiLife analysis reports, for this study"
      version: "1.0"
    environmentId: "env-ubilife"
    dependsOn:
      - "decode"
      - "split"
      - "prepare-steps"
      - "prepare-surveys"
    task:
      type: "command"
      id: "task-findings"
      name: "findings"
      executable: "python"
      args:
        - "scripts/ubilife/findings.py"
        - "--provenance"
        - "input.0"
        - "--measurements"
        - "input.1"
        - "--steps"
        - "input.2"
        - "--intervals"
        - "input.3"
        - "--survey"
        - "input.4"
        - "--heartbeat"
        - "input.5"
        - "--deviceinformation"
        - "input.6"
        - "--onboarding"
        - "input.7"
        - "--stress"
        - "input.8"
        - "--sleep"
        - "input.9"
        - "--who5"
        - "input.10"
        - "--bfi10"
        - "input.11"
        - "--events"
        - "input.12"
        - "--from"
        - "2026-10-11"
        - "--to"
        - "2026-10-16"
        - "--coverage-from"
        - "2026-10-11 00:00:00"
        - "--coverage-to"
        - "2026-10-15 23:59:59"
        - "--output"
        - "output.0"
    inputs:
      - id: "provenance"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Provenance table"
        source:
          type: "step-output"
          stepId: "decode"
          outputId: "provenance"
      - id: "measurements"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Measurement table"
        source:
          type: "step-output"
          stepId: "decode"
          outputId: "measurements"
      - id: "steps"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Step counter: stepcount (2025) or stepevent (2026)"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "steps"
      - id: "intervals"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Per-interval steps"
        source:
          type: "step-output"
          stepId: "prepare-steps"
          outputId: "intervals"
      - id: "survey"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Surveys, one row each, the task result as JSON"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "survey"
      - id: "heartbeat"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Sampling heartbeat"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "heartbeat"
      - id: "deviceinformation"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Device reports"
        source:
          type: "step-output"
          stepId: "split"
          outputId: "deviceinformation"
      - id: "onboarding"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant: age, gender, role, prior UbiComp, presenter"
        source:
          type: "step-output"
          stepId: "prepare-surveys"
          outputId: "onboarding"
      - id: "stress"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per answer: stress 0-10"
        source:
          type: "step-output"
          stepId: "prepare-surveys"
          outputId: "stress"
      - id: "sleep"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per answer: sleep quality and hours"
        source:
          type: "step-output"
          stepId: "prepare-surveys"
          outputId: "sleep"
      - id: "who5"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant: WHO-5 items and score"
        source:
          type: "step-output"
          stepId: "prepare-surveys"
          outputId: "who5"
      - id: "bfi10"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant: Big Five dimensions"
        source:
          type: "step-output"
          stepId: "prepare-surveys"
          outputId: "bfi10"
      - id: "events"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "One row per participant per session or keynote rating"
        source:
          type: "step-output"
          stepId: "prepare-surveys"
          outputId: "events"
    outputs:
      - id: "findings"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "metric, value"

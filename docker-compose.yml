services:
  dsp-portal:
    build:
      # The directory holding this repo, carp-dsp and carp.core-kotlin. The
      # server is built against the last two, so all three have to be in the
      # context. Dockerfile.dockerignore keeps everything else out.
      context: ..
      dockerfile: carp-dsp-portal/Dockerfile
    image: carp-dsp-portal:dev
    ports:
      - "8080:8080"
    environment:
      DSP_PORT: "8080"
      DSP_VERSION: "dev"
      # real runs workflows through the engine, simulated replays recorded
      # results. Switchable live from the top bar; this is only the value the
      # container starts with.
      DSP_MODE: "real"
      # Composed workflows, runs, schedules and uploads. On the named volume
      # below, so a rebuild does not wipe a session mid-demo.
      DSP_STATE: "/state/portal-state.json"
      DSP_RUNS: "/state/runs"
    # Optional, and gitignored: CARP_DSP_SQL_URL, CARP_DSP_SQL_USER and
    # CARP_DSP_SQL_PASSWORD for core.io.query-sql. Steps inherit the server's
    # environment, so credentials reach the step without being written into a
    # workflow or a bundle. Values saved on the portal's Settings page replace
    # these for runs, without a restart.
    env_file:
      - path: .env
        required: false
    volumes:
      - portal-state:/state
      # Optional. The step library, demo workflows, scripts and sample data are
      # baked into the image, so the portal runs without this. Mount a checkout
      # to read them live instead - edit a step, restart, see it.
      # - ../carp-dsp:/repo:ro
      # and set DSP_REPO: "/repo" above.
    restart: unless-stopped

  # Optional: a local stand-in for the CARP database, seeded from study exports,
  # for testing the UbiLife workflow without production access. Started only with
  # `docker compose --profile test-db up -d`; see demo-bundles/tools/ubilife/.
  # The portal reaches it as jdbc:postgresql://test-db:5432/carp (user and
  # password carp), set on the Settings page.
  test-db:
    image: postgres:16
    profiles: ["test-db"]
    environment:
      POSTGRES_DB: carp
      POSTGRES_USER: carp
      POSTGRES_PASSWORD: carp
    volumes:
      - ./demo-bundles/tools/ubilife/test-db:/docker-entrypoint-initdb.d:ro

volumes:
  portal-state:
